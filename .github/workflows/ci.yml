name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt ruff==0.8.4
      - name: Lint
        run: ruff check --isolated --select F,E9 backend local_agent_runner.py tests
      - name: Type check
        run: npx --yes pyright@1.1.390 --pythonpath "$(which python)"
      - name: Test
        run: python -m pytest tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: npm ci
      - name: Build and lint
        run: CI=true npm run build
